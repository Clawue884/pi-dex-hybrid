version: "3.9"

services:
  amm:
    build: ../backend-amm
    container_name: pi-amm
    env_file:
      - .env.prod
    restart: always

  orderbook:
    build: ../orderbook
    container_name: pi-orderbook
    env_file:
      - .env.prod
    restart: always

  frontend:
    build: ../frontend
    container_name: pi-frontend
    env_file:
      - .env.prod
    restart: always

  nginx:
    image: nginx:alpine
    container_name: pi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - amm
      - orderbook
    restart: always
